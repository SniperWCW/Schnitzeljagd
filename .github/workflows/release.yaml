name: Release

# Legt automatisch Tag und GitHub-Release an, sobald sich die Version in
# custom_components/schnitzeljagd/manifest.json auf main ändert.

on:
  push:
    branches: [main]
    paths:
      - custom_components/schnitzeljagd/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus manifest.json lesen
        id: ver
        run: echo "version=$(jq -r .version custom_components/schnitzeljagd/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob Tag schon existiert
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ZIP für HACS bauen
        if: steps.exists.outputs.exists == 'false'
        run: |
          cd custom_components/schnitzeljagd
          zip -r ../../schnitzeljagd.zip . -x "*/__pycache__/*"

      - name: Tag und Release erstellen
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" schnitzeljagd.zip \
            --target "${{ github.sha }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes
